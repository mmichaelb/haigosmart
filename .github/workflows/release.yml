name: release

on:
  push:
    branches: [main]

  # Recovery path. A release that failed after its tag was created cannot be
  # retried by re-running the push workflow: semantic-release sees the tag as the
  # latest release with nothing newer to release, so it never reaches the publish
  # phase and GoReleaser is never invoked. This republishes artefacts for a tag
  # that already exists.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish artefacts for, e.g. v1.0.0'
        required: true
        type: string

# Do not split this into "tag here, release there".
#
# GitHub does not start a workflow from an event created with the run's own
# GITHUB_TOKEN — a deliberate loop guard. A second workflow triggered by
# `on: push: tags` would therefore never run, and nothing would report an error:
# the tag appears, no artefacts are built, and the failure is silent until
# somebody asks where the binaries went.
#
# So semantic-release and GoReleaser share one job. semantic-release creates the
# tag, then invokes `goreleaser release` from its publish phase (see
# .releaserc.json). That placement also means GoReleaser runs only when there was
# something to release, so "publish nothing when nothing changed" needs no
# condition anywhere.
#
# See specs/004-public-release-automation/research.md §2 and docs/releasing.md.

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit analyser reads back to the previous tag. A shallow clone
          # makes it decide from a truncated history, which is wrong quietly.
          fetch-depth: 0
          # On a dispatch, build the tag as it was, not the current main.
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      # No stored registry credential exists: this is the run's own token, and
      # it is why a fork's pull request has nothing to reach.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # semantic-release shells out to `goreleaser` from its publish phase, so the
      # binary has to be on PATH before that runs. install-only: it is invoked by
      # semantic-release, not by this action.
      - uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true
          version: '2.18.0'

      - name: install release tooling
        run: npm ci

      - name: release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # The dispatch path skips semantic-release entirely: the version already
      # exists and must not be recomputed. GoReleaser builds the tag as it stands.
      - name: republish artefacts for an existing tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
        run: goreleaser release --clean

      # GoReleaser creates the release as a draft. It becomes visible only here,
      # once the image manifest is confirmed to resolve for both architectures.
      #
      # The point is what happens when something fails: a run that uploads the
      # binaries and then cannot push the images leaves an invisible draft and a
      # red job, instead of a release on the front page advertising an image that
      # does not exist. A draft release means a failed run — see docs/releasing.md.
      - name: verify the artefacts, then publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${DISPATCH_TAG:-$(git describe --tags --abbrev=0 2>/dev/null || true)}"
          if [ -z "$tag" ]; then
            echo "no tag exists; nothing was released"
            exit 0
          fi
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo false)" != "true" ]; then
            echo "$tag has no draft release; nothing was released in this run"
            exit 0
          fi

          version="${tag#v}"
          image="ghcr.io/mmichaelb/haigosmart:${version}"
          echo "verifying $image"
          docker buildx imagetools inspect "$image" > manifest.txt
          for platform in linux/amd64 linux/arm64; do
            grep -q "$platform" manifest.txt || {
              echo "::error::$image has no $platform manifest; leaving $tag as a draft"
              exit 1
            }
          done

          assets="$(gh release view "$tag" --json assets --jq '.assets | length')"
          if [ "$assets" -ne 7 ]; then
            echo "::error::$tag has $assets assets, expected 7; leaving it as a draft"
            exit 1
          fi

          gh release edit "$tag" --draft=false
          echo "published $tag"
